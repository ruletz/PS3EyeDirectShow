name: Build driver

# UNTESTED: the driver it builds has never been compiled, so runs are expected
# to fail with real compiler errors; the log is the point of this job. No SDK or
# WDK is installed here on purpose: the windows-2022 image already ships the WDK
# (10.1.26100) with its Visual Studio extension and SDK 10.0.22621, which is what
# this project targets. Downloading the installers (the previous approach) fails
# on the runner with "The file or directory is corrupted and unreadable".
#
# Builds the AVStream camera driver and the capture service in the cloud, so no
# Visual Studio / WDK install is needed on a developer machine. Artifacts are
# test-signed with a throwaway self-signed certificate: they load on a test
# machine only if that machine has `bcdedit /set testsigning on`.
on:
  push:
    branches: [master]
    paths:
      - 'Win11VirtualCamera/**'
      - 'MediaFoundationSource/**'
      - '.github/workflows/build-driver.yml'
  pull_request:
    paths:
      - 'Win11VirtualCamera/**'
      - 'MediaFoundationSource/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The WDK is part of the runner image, so nothing is installed here. Fail
      # early with a readable message if that ever stops being true, instead of
      # letting the driver build die on an unresolved platform toolset.
      - name: Verify the WDK toolset is present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $km = 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\km'
          if (-not (Test-Path $km)) { throw "WDK kernel-mode headers not found at $km" }
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x86\Inf2Cat.exe')) {
            throw 'Inf2Cat not found'
          }
          Write-Host "WDK present: $km"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "--- Windows Kits ---"
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          Write-Host "--- WDK build props ---"
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\build' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      # User-mode pieces (MF virtual camera + registrar). These are expected to
      # build; if they break, the problem is local to this step.
      - name: Build user-mode projects
        run: msbuild Win11VirtualCamera\PS3EyeWin11.sln /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo

      # The driver. This is the step that has never run: expect real errors here
      # the first time. The log is the whole point of this job.
      - name: Build AVStream driver
        run: msbuild Win11VirtualCamera\KernelDriver\PS3EyeVCamKernel.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=Win11VirtualCamera\ /v:minimal /nologo

      - name: Build capture service
        run: msbuild MediaFoundationSource\PS3EyeCaptureService.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=MediaFoundationSource\ /v:minimal /nologo

      - name: Make catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' |
                  Sort-Object Name | Select-Object -Last 1).Name
          $inf2cat = "C:\Program Files (x86)\Windows Kits\10\bin\$ver\x86\Inf2Cat.exe"
          if (-not (Test-Path $inf2cat)) { throw "Inf2Cat not found at $inf2cat" }

          $out = 'Win11VirtualCamera\bin\x64\Release'
          Copy-Item 'Win11VirtualCamera\KernelDriver\PS3EyeVCamKernel.inf' $out -Force
          & $inf2cat /driver:$out /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed with $LASTEXITCODE" }

      # Throwaway certificate. A kernel driver will not load unsigned at all,
      # and test signing accepts a self-signed cert once it is in the stores.
      - name: Test-sign the driver package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Resolve-Path 'Win11VirtualCamera\bin\x64\Release'

          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=PS3EyeTest' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -HashAlgorithm SHA256 -KeyUsage DigitalSignature `
            -NotAfter (Get-Date).AddYears(2)
          $thumb = $cert.Thumbprint
          Write-Host "Cert thumbprint: $thumb"

          Export-Certificate -Cert $cert -FilePath "$out\PS3EyeTest.cer" | Out-Null
          $pw = ConvertTo-SecureString -String 'ps3eye' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$out\PS3EyeTest.pfx" -Password $pw | Out-Null

          # Trust the cert in this store only so signtool is happy; the test
          # machine needs PS3EyeTest.cer in LocalMachine\Trusted Root and
          # Trusted Publishers.
          $root = New-Object System.Security.Cryptography.X509Certificates.X509Store('Root', 'CurrentUser')
          $root.Open('ReadWrite'); $root.Add($cert); $root.Close()

          $ver = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
                  Sort-Object Name | Select-Object -Last 1).Name
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\$ver\x64\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool not found at $signtool" }

          foreach ($f in @("$out\PS3EyeVCamKernel.sys", "$out\PS3EyeVCamKernel.cat")) {
            & $signtool sign /v /fd SHA256 /sha1 $thumb $f
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $f with $LASTEXITCODE" }
          }
          & $signtool verify /v /pa "$out\PS3EyeVCamKernel.cat"

      - name: Collect artifacts
        shell: pwsh
        run: |
          $dest = 'artifacts'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          $driverOut = 'Win11VirtualCamera\bin\x64\Release'
          foreach ($name in 'PS3EyeVCamKernel.sys','PS3EyeVCamKernel.cat','PS3EyeVCamKernel.inf',
                            'PS3EyeVCamSource.dll','PS3EyeVCamRegistrar.exe',
                            'PS3EyeTest.cer','PS3EyeTest.pfx') {
            $p = Join-Path $driverOut $name
            if (Test-Path $p) { Copy-Item $p $dest -Force } else { Write-Host "missing: $name" }
          }
          Copy-Item 'Win11VirtualCamera\KernelDriver\Install-PS3EyeDriver.ps1' $dest -Force

          $svc = 'MediaFoundationSource\bin\x64\Release\PS3EyeCaptureService.exe'
          if (Test-Path $svc) { Copy-Item $svc $dest -Force } else { Write-Host "missing: PS3EyeCaptureService.exe" }

          Get-ChildItem $dest | Select-Object Name, Length

      # Runs even when a step failed, so a broken build still gives you the
      # binaries that did get produced plus the log.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS3EyeVCam
          path: artifacts/
          if-no-files-found: warn
